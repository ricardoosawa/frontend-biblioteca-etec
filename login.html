<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administração - Biblioteca Etec</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>Área da Administração</h1>
        <p>Acesso exclusivo para gestão de agendamentos da biblioteca.</p>

        <div id="loadingStatus" style="text-align: center; margin: 20px 0;">
            <p>Verificando sistema...</p>
        </div>

        <form id="formLogin" style="display: none;">
            <h3>Fazer Login</h3>
            <div class="campo">
                <label for="emailLogin">E-mail Institucional:</label>
                <input type="email" id="emailLogin" required placeholder="bibliotecario@etec.sp.gov.br">
            </div>
            <div class="campo">
                <label for="senhaLogin">Senha de Acesso:</label>
                <input type="password" id="senhaLogin" required placeholder="Digite sua senha">
            </div>
            <button type="submit">Entrar no Painel</button>
        </form>

        <form id="formRegistro" style="display: none;">
            <h3>Criar Usuário Administrador (1º Acesso)</h3>
            <div class="campo">
                <label for="nomeRegistro">Nome:</label>
                <input type="text" id="nomeRegistro" required placeholder="Seu nome">
            </div>
            <div class="campo">
                <label for="emailRegistro">E-mail Institucional:</label>
                <input type="email" id="emailRegistro" required placeholder="bibliotecario@etec.sp.gov.br">
            </div>
            <div class="campo">
                <label for="senhaRegistro">Crie uma Senha:</label>
                <input type="password" id="senhaRegistro" required placeholder="Crie uma senha forte">
            </div>
            <div class="campo">
                <label for="senhaRegistroConfirm">Confirme a Senha:</label>
                <input type="password" id="senhaRegistroConfirm" required placeholder="Repita a senha">
            </div>
            <button type="submit" style="background-color: #0056b3;">Registrar e Entrar</button>
        </form>

        <div class="link-admin">
            <a href="index.html">← Voltar para Agendamento de Alunos</a>
        </div>
    </main>

    <script src="auth.js"></script>

</body>
</html>
