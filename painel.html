<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão - Biblioteca</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="fundo-painel">

    <main class="container-painel">
        <header class="cabecalho-painel">
            <div>
                <h1>Gestão de Agendamentos</h1>
                <p>Biblioteca - Etec prof. Luiz Pires Barbosa</p>
            </div>
            
            <div class="controles-topo">
                <button id="btn-perfil" class="btn-secundario" onclick="window.location.href='perfil.html'">
                    👤 Meu Perfil
                </button>
                <button id="btn-sair" class="btn-sair" onclick="logout()">
                    Sair do Painel
                </button>
            </div>
            </header>

        <section class="tabela-responsiva">
            <table>
                <thead>
                    <tr>
                        <th>RM</th>
                        <th>Nome</th> 
                        <th>Curso</th>
                        <th>E-mail</th>
                        <th>Serviço</th>
                        <th>Data</th>
                        <th>Horário</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                
                <tbody>
                    <tr>
                        <td colspan="9" style="text-align: center; padding: 20px;">
                            ⏳ Carregando agendamentos do sistema...
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
<script src="painel.js"></script>
</body>
</html>
