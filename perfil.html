<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil - Biblioteca</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Um pequeno estilo extra só para o formulário não ficar gigante na tela */
        .cartao-perfil {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
        }
        .grupo-input {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        .grupo-input label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .grupo-input input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-salvar {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-salvar:hover {
            background-color: #218838;
        }
    </style>
</head>
<body class="fundo-painel">

    <main class="container-painel">
        <header class="cabecalho-painel">
            <div>
                <h1>Meu Perfil</h1>
                <p>Configurações da conta de Administrador</p>
            </div>
            <button class="btn-secundario" onclick="window.location.href='painel.html'">
                ⬅ Voltar ao Painel
            </button>
        </header>

        <section class="cartao-perfil">
            <form id="formPerfil">
                <div class="grupo-input">
                    <label for="nomeAdmin">Nome Completo</label>
                    <input type="text" id="nomeAdmin" required>
                </div>
                
                <div class="grupo-input">
                    <label for="emailAdmin">E-mail Institucional</label>
                    <input type="email" id="emailAdmin" required>
                </div>

                <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

                <p style="font-size: 14px; color: #666; margin-bottom: 15px;">
                    Preencha os campos abaixo <strong>apenas se desejar trocar sua senha</strong>. Caso contrário, deixe-os em branco.
                </p>

                <div class="grupo-input">
                    <label for="senhaAtual">Senha Atual</label>
                    <input type="password" id="senhaAtual" placeholder="Digite para confirmar alterações">
                </div>

                <div class="grupo-input">
                    <label for="novaSenha">Nova Senha</label>
                    <input type="password" id="novaSenha" placeholder="Digite a nova senha">
                </div>

                <button type="submit" class="btn-salvar">Salvar Alterações</button>
            </form>
        </section>
    </main>

    <script src="perfil.js"></script>
</body>
</html>
